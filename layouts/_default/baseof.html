<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="{{ .Description | default site.Params.description }}"><title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>{{ $style := resources.Get "css/site.css" | minify | fingerprint }}{{ $profileStyle := resources.Get "css/profile.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}"><link rel="stylesheet" href="{{ $profileStyle.RelPermalink }}" integrity="{{ $profileStyle.Data.Integrity }}"></head><body>{{ partial "header.html" . }}<main id="main">{{ block "main" . }}{{ end }}</main>{{ partial "footer.html" . }}</body></html>
